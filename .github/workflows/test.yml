name: test

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24, 26]
        include:
          # The oldest supported Node: the first 22.x whose built-in SQLite has FTS5.
          # Packages only: the site's own tests run .ts files, which Node 22 does from 22.18.
          - os: ubuntu-latest
            node: 22.16.0
            filter: ./packages/*
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm turbo test --continue ${{ matrix.filter && format('--filter={0}', matrix.filter) || '' }}

  site-browser:
    # receipts.webaes.com in a real browser: links, copy buttons, tabs, the page stamp,
    # the real-receipt demo, the waitlist (mocked), and the layout at 360-1920px
    name: site / browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo build --filter=@agent-receipts/site...
      - run: pnpm --filter @agent-receipts/site exec playwright install --with-deps chromium
      - run: pnpm --filter @agent-receipts/site test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: site-browser-traces
          path: apps/site/test-results
          retention-days: 7
